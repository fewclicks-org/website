<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='18' fill='%23ffc93c' stroke='%23141414' stroke-width='8'/><text x='50' y='72' font-size='60' text-anchor='middle' font-family='Arial Black'>F</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>All games | FewClicks</title>
  <meta name="description" content="Every FewClicks game for mobile, PC and console.">
</head>
<body data-page="games">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-chrome="header"></header>
  <main id="main">
    <section class="playground page-head" data-pagehead aria-label="Games"><h1 class="sr-only">All games</h1></section>
    <div class="wrap">
      <div class="filters" role="search">
        <div class="frow">
          <label class="sr-only" for="q">Search games</label>
          <input id="q" type="search" placeholder="🔍 Search games…" data-q autocomplete="off">
          <label class="sr-only" for="sort">Sort</label>
          <select id="sort" data-sort><option value="featured">Featured</option><option value="newest">Newest</option><option value="rating">Top rated</option><option value="az">A–Z</option></select>
        </div>
        <div class="frow" role="group" aria-label="Platform">
          <button class="chip" type="button" data-platform="all">All platforms</button>
          <button class="chip" type="button" data-platform="mobile">📱 Mobile</button>
          <button class="chip" type="button" data-platform="pc">💻 PC</button>
          <button class="chip" type="button" data-platform="console">🎮 Console</button>
        </div>
        <div class="frow" role="group" aria-label="Category" data-cats></div>
      </div>
      <p class="sr-only" aria-live="polite" data-status></p>
      <div class="grid" data-grid></div>
      <div class="empty" data-empty hidden><div style="font-size:64px">🧸</div><h2>Toy box is empty!</h2><p>No games match. Try different filters.</p><p style="margin-top:16px"><button class="btn btn--red" type="button" data-reset>Reset filters</button></p></div>
    </div>
  </main>
  <footer data-chrome="footer"></footer>
  <script defer src="../vendor/matter.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
