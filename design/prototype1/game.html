<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Game | FewClicks</title>
  <meta name="description" content="A game by FewClicks.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fdf3ff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ff5fa2'/><path d='M40 30 L40 72 L50.5 62 L58 78 L65 75 L57.5 59 L72 59Z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="loader" aria-hidden="true"><div class="loader-dots"><i style="--b:#ff5fa2"></i><i style="--b:#7b5cff"></i><i style="--b:#2fd6a6"></i></div></div>
  <canvas id="bubble-canvas" aria-hidden="true"></canvas>
  <header data-chrome="header"></header>

  <main id="main" data-game></main>

  <footer data-chrome="footer"></footer>

  <dialog class="modal lightbox" id="lightbox" aria-label="Screenshot viewer">
    <img src="" alt="" data-lb-img>
    <div class="lightbox-nav">
      <button class="icon-btn" type="button" data-lb-prev aria-label="Previous screenshot">←</button>
      <button class="icon-btn" type="button" data-lb-close aria-label="Close">✕</button>
      <button class="icon-btn" type="button" data-lb-next aria-label="Next screenshot">→</button>
    </div>
  </dialog>

  <script defer src="../vendor/gsap.min.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
