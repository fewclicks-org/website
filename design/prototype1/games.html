<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>All games | FewClicks</title>
  <meta name="description" content="Every FewClicks game for mobile, PC and console. Filter by category and platform.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fdf3ff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ff5fa2'/><path d='M40 30 L40 72 L50.5 62 L58 78 L65 75 L57.5 59 L72 59Z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="bubble-canvas" aria-hidden="true"></canvas>
  <header data-chrome="header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">🎮 The whole bubble bath</span>
        <h1 class="page-title">All games<span class="count" data-count aria-label="games">0</span></h1>
        <p class="section-lead">Phones, PCs and consoles. Pick a flavour, find your next favourite.</p>
      </div>
    </section>

    <section class="container" aria-label="Game list">
      <div class="filters" role="search">
        <div class="filter-row">
          <label class="search">
            <span class="sr-only">Search games</span>
            <input type="search" placeholder="Search games…" data-q autocomplete="off">
          </label>
          <div class="segmented" role="group" aria-label="Platform" data-platforms>
            <button type="button" data-platform="all" aria-pressed="true">All</button>
            <button type="button" data-platform="mobile" aria-pressed="false">📱 Mobile</button>
            <button type="button" data-platform="pc" aria-pressed="false">💻 PC</button>
            <button type="button" data-platform="console" aria-pressed="false">🎮 Console</button>
          </div>
          <label>
            <span class="sr-only">Sort by</span>
            <select class="select" data-sort>
              <option value="featured">✨ Featured</option>
              <option value="newest">🆕 Newest</option>
              <option value="rating">⭐ Top rated</option>
              <option value="az">🔤 A–Z</option>
            </select>
          </label>
        </div>
        <div class="cat-chips" role="group" aria-label="Category" data-cats></div>
      </div>

      <p class="sr-only" aria-live="polite" data-status></p>
      <div class="games-grid" data-grid></div>
      <div class="empty" data-empty>
        <div class="sad" aria-hidden="true">🫧</div>
        <h2>No bubbles here!</h2>
        <p>Nothing matches those filters. Try another flavour.</p>
        <button class="btn btn--primary" type="button" data-reset>Reset filters</button>
      </div>
    </section>
  </main>

  <footer data-chrome="footer"></footer>

  <script defer src="../vendor/gsap.min.js"></script>
  <script defer src="../vendor/Flip.min.js"></script>
  <script type="module" src="js/games.js"></script>
</body>
</html>
